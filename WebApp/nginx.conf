# Drop-in para /etc/nginx/conf.d/default.conf en la imagen oficial nginx:alpine.
# Build context esperado: WebApp/dist copiado a /usr/share/nginx/html.
# Upstream: el Server (canelary-server) debe ser resoluble en la red docker.
# Cambiar el host/puerto del upstream si el servicio se llama distinto.

upstream canelary_api {
    server canelary-server:8080;
    keepalive 32;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  canelary.runfosa.local;

    root  /usr/share/nginx/html;
    index index.html;

    # Compresion
    gzip               on;
    gzip_vary          on;
    gzip_comp_level    6;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Cabeceras de seguridad basicas para la UI
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Assets versionados por Vite (hash en el nombre): cache largo e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea — habilita despliegues sin purgar CDN/browser
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Endpoints del Server: reverse proxy mismo-origen (evita CORS).
    # Coincidencia exacta de los paths declarados en Server/Server.cs.
    location ~ ^/(clients|validate-client|multiple-installations|not-installed|get-client|installer|client-version)$ {
        proxy_pass         http://canelary_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # /installer puede transferir el binario del Client
        client_max_body_size 100m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
        proxy_buffering      off;
    }

    # SPA fallback: cualquier ruta no resuelta cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck opcional para el contenedor
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
